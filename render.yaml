services:
  - type: web
    name: ags-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-silk-seven-87.vercel.app
      - key: FRONTEND_URL
        value: https://frontend-silk-seven-87.vercel.app
      - key: PUBLIC_URL
        value: https://services-xehg.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://services-xehg.onrender.com/api/auth/google/callback
      # Still needed before the backend can fully boot/function — fill in
      # via the Render dashboard once ready (see docs/deployment notes):
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: ags-python-service
    runtime: python
    plan: free
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://frontend-silk-seven-87.vercel.app,https://services-xehg.onrender.com
